<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Bank POS — New Order</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .app-root { grid-template-columns: 220px 1fr 340px; }

    /* MENU AREA */
    .menu-area { display:flex; flex-direction:column; overflow:hidden; background:var(--bg); }
    .menu-header { padding:14px 20px; display:flex; gap:12px; align-items:center; border-bottom:1px solid var(--border); }
    .cats { display:flex; gap:8px; padding:12px 20px; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--border); }
    .cats::-webkit-scrollbar { display:none; }
    .cat-btn { flex-shrink:0; padding:7px 16px; border-radius:20px; border:1px solid var(--border); background:var(--surface); color:var(--fg2); font-size:12px; font-weight:500; cursor:pointer; transition:all .15s; }
    .cat-btn:hover { border-color:var(--accent); color:var(--accent2); }
    .cat-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    .menu-grid { flex:1; overflow-y:auto; padding:16px 20px; display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; align-content:start; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
    .menu-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; cursor:pointer; transition:all .2s; position:relative; }
    .menu-card:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 8px 24px rgba(232,67,26,.15); }
    .card-img { width:100%; aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; font-size:42px; background:var(--surface2); }
    .card-body { padding:10px; }
    .card-name { font-weight:600; font-size:13px; margin-bottom:2px; line-height:1.3; }
    .card-desc { font-size:11px; color:var(--fg3); margin-bottom:8px; line-height:1.3; }
    .card-footer { display:flex; align-items:center; justify-content:space-between; }
    .card-price { font-weight:700; font-size:14px; color:var(--accent2); font-variant-numeric:tabular-nums; }
    .add-btn { width:26px; height:26px; background:var(--accent); border:none; border-radius:6px; color:#fff; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s; }
    .add-btn:hover { background:var(--accent2); }
    .bestseller-tag { position:absolute; top:8px; left:8px; background:var(--gold); color:#000; font-size:9px; font-weight:700; padding:2px 7px; border-radius:4px; letter-spacing:.5px; }

    /* ORDER PANEL */
    .order-panel { background:var(--surface); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
    .order-header { padding:16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .order-title { font-family:'Poppins',sans-serif; font-weight:700; font-size:15px; }
    .order-type-tabs { display:flex; padding:10px 16px; gap:6px; border-bottom:1px solid var(--border); }
    .type-tab { flex:1; padding:7px; border:1px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--fg2); font-size:11px; font-weight:600; cursor:pointer; text-align:center; transition:all .15s; }
    .type-tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    .order-items { flex:1; overflow-y:auto; padding:10px 16px; display:flex; flex-direction:column; gap:8px; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
    .order-item { background:var(--surface2); border-radius:10px; padding:10px 12px; display:flex; align-items:center; gap:10px; border:1px solid var(--border); }
    .item-emoji { font-size:22px; flex-shrink:0; }
    .item-info { flex:1; min-width:0; }
    .item-name { font-weight:600; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .item-variant { font-size:10px; color:var(--fg3); margin-top:1px; }
    .qty-controls { display:flex; align-items:center; gap:6px; flex-shrink:0; }
    .qty-btn { width:22px; height:22px; border:1px solid var(--border); border-radius:5px; background:var(--surface3); color:var(--fg); cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; transition:all .15s; }
    .qty-btn:hover { border-color:var(--accent); color:var(--accent2); }
    .qty-num { font-weight:700; font-size:13px; min-width:18px; text-align:center; font-variant-numeric:tabular-nums; }
    .item-price { font-weight:700; font-size:13px; color:var(--accent2); min-width:52px; text-align:right; font-variant-numeric:tabular-nums; }
    .empty-order { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--fg3); gap:8px; font-size:13px; }
    .empty-order-icon { font-size:40px; opacity:.4; }
    .order-footer { border-top:1px solid var(--border); padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
    .customer-row { display:flex; gap:8px; }
    .customer-input { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:7px; color:var(--fg); padding:7px 10px; font-size:12px; outline:none; transition:border-color .15s; }
    .customer-input:focus { border-color:var(--accent); }
    .total-row { display:flex; justify-content:space-between; font-size:12px; color:var(--fg2); }
    .total-row span:last-child { font-variant-numeric:tabular-nums; }
    .total-row.grand { color:var(--fg); font-size:16px; font-weight:700; padding:8px 0 4px; border-top:1px solid var(--border); margin-top:4px; }
    .discount-row { display:flex; gap:8px; align-items:center; }
    .discount-input { width:70px; background:var(--surface2); border:1px solid var(--border); border-radius:7px; color:var(--fg); padding:6px 10px; font-size:12px; outline:none; }
    .pay-btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px; }
    .pay-btn { padding:12px 8px; border:none; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; transition:all .15s; display:flex; align-items:center; justify-content:center; gap:6px; }
    .pay-btn:hover { filter:brightness(1.1); transform:translateY(-1px); }
    .pay-cash { background:var(--success); color:#fff; }
    .pay-card { background:var(--surface3); border:1px solid var(--border); color:var(--fg); }
    .pay-split { background:var(--gold); color:#000; }
    .pay-hold { background:var(--surface3); border:1px solid var(--border); color:var(--fg2); }
    .kot-item { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--border); font-size:13px; }
  </style>
</head>
<body>
  <div class="app-root with-panel">
    <header class="topbar" id="topbar"></header>
    <nav class="sidebar" id="sidebar"></nav>

    <!-- MENU AREA -->
    <main class="menu-area">
      <div class="menu-header">
        <div class="search-box" style="flex:1;">
          <input type="text" id="searchInput" placeholder="Search menu items…" oninput="searchText=this.value;renderMenu()">
        </div>
      </div>
      <div class="cats" id="catBtns"></div>
      <div class="menu-grid" id="menuGrid"></div>
    </main>

    <!-- ORDER PANEL -->
    <aside class="order-panel">
      <div class="order-header">
        <div class="order-title">Current Order</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <span style="font-size:12px;color:var(--fg3);">Table <strong style="color:var(--gold)" id="activeTableLabel">T1</strong></span>
          <button onclick="cart=[];renderCart()" style="background:none;border:none;color:var(--fg3);cursor:pointer;font-size:18px;line-height:1;" title="Clear order">🗑</button>
        </div>
      </div>
      <div class="order-type-tabs">
        <button class="type-tab active" data-type="Dine-in" onclick="setOrderType('Dine-in')">🍽 Dine-in</button>
        <button class="type-tab" data-type="Takeaway" onclick="setOrderType('Takeaway')">🥡 Takeaway</button>
        <button class="type-tab" data-type="Delivery" onclick="setOrderType('Delivery')">🛵 Delivery</button>
      </div>
      <div class="order-items" id="orderItems"></div>
      <div class="order-footer">
        <div class="customer-row">
          <input class="customer-input" placeholder="👤 Customer name" style="flex:1.4">
          <input class="customer-input" placeholder="📱 Phone">
        </div>
        <div class="discount-row">
          <span style="font-size:12px;color:var(--fg2);">Discount %</span>
          <input class="discount-input" id="discInput" type="number" min="0" max="100" placeholder="0" oninput="updateDiscount()">
          <span style="margin-left:auto;font-size:11px;color:var(--fg3);">5% Tax</span>
        </div>
        <div class="total-row"><span>Subtotal</span><span id="subtotalVal">Rs. 0</span></div>
        <div class="total-row" style="color:var(--success)"><span>Discount</span><span id="discountVal">− Rs. 0</span></div>
        <div class="total-row"><span>Tax (5%)</span><span id="taxVal">Rs. 0</span></div>
        <div class="total-row grand"><span>Total</span><span id="grandVal">Rs. 0</span></div>
        <button class="pay-btn" style="width:100%;background:var(--surface3);border:1px solid var(--border);color:var(--fg2);margin-bottom:4px;font-size:12px;" onclick="openKOT()">
          🎫 Send to Kitchen (KOT)
        </button>
        <div class="pay-btns">
          <button class="pay-btn pay-cash" onclick="processPayment('Cash')">💵 Cash</button>
          <button class="pay-btn pay-card" onclick="processPayment('Card')">💳 Card</button>
          <button class="pay-btn pay-split" onclick="processPayment('Split')">🔀 Split</button>
          <button class="pay-btn pay-hold" onclick="showToast('🕒 Order held!')">⏸ Hold</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- KOT MODAL -->
  <div class="modal-overlay" id="kotModal" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="modal">
      <h3>🎫 Kitchen Order Ticket</h3>
      <div style="font-size:11px;color:var(--fg3);margin-bottom:12px;" id="kotInfo">Table T1 · Dine-in</div>
      <div id="kotBody"></div>
      <div class="modal-btns">
        <button class="modal-btn modal-cancel" onclick="document.getElementById('kotModal').classList.remove('open')">Cancel</button>
        <button class="modal-btn modal-confirm" onclick="confirmKOT()">✅ Confirm & Send</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    let cart = [], orderType = 'Dine-in', activeTable = 'T1';
    let activeCategory = 'All', searchText = '', discountPct = 0;

    function selectTable(id) {
      activeTable = id;
      document.getElementById('activeTableLabel').textContent = id;
      document.querySelectorAll('.table-chip').forEach(c => c.classList.remove('active'));
      const chip = document.getElementById('chip-' + id);
      if (chip) chip.classList.add('active');
    }

    function filteredMenu() {
      return MENU.filter(item => {
        const catOk = activeCategory === 'All' || item.cat === activeCategory;
        const searchOk = !searchText || item.name.toLowerCase().includes(searchText.toLowerCase());
        return catOk && searchOk;
      });
    }

    function addToCart(id) {
      const item = MENU.find(m => m.id === id);
      const ex = cart.find(c => c.id === id);
      if (ex) ex.qty++;
      else cart.push({ ...item, qty: 1 });
      renderCart();
      showToast(item.emoji + ' Added to order');
    }

    function changeQty(id, delta) {
      const idx = cart.findIndex(c => c.id === id);
      if (idx < 0) return;
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      renderCart();
    }

    function subtotal() { return cart.reduce((s,i) => s + i.price * i.qty, 0); }
    function discountAmt() { return Math.round(subtotal() * discountPct / 100); }
    function taxAmt() { return Math.round((subtotal() - discountAmt()) * 0.05); }
    function grandTotal() { return subtotal() - discountAmt() + taxAmt(); }

    function renderMenu() {
      const grid = document.getElementById('menuGrid');
      const items = filteredMenu();
      if (!items.length) { grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--fg3);">No items found</div>'; return; }
      grid.innerHTML = items.map(item => `
        <div class="menu-card" onclick="addToCart(${item.id})">
          ${item.best ? '<div class="bestseller-tag">BESTSELLER</div>' : ''}
          <div class="card-img">${item.emoji}</div>
          <div class="card-body">
            <div class="card-name">${item.name}</div>
            <div class="card-desc">${item.desc}</div>
            <div class="card-footer">
              <span class="card-price">${fmt(item.price)}</span>
              <button class="add-btn" onclick="event.stopPropagation();addToCart(${item.id})">+</button>
            </div>
          </div>
        </div>`).join('');
    }

    function renderCats() {
      document.getElementById('catBtns').innerHTML = CATEGORIES.map(c =>
        `<button class="cat-btn ${c===activeCategory?'active':''}" onclick="setCategory('${c}')">${c}</button>`
      ).join('');
    }

    function setCategory(cat) { activeCategory = cat; renderCats(); renderMenu(); }

    function renderCart() {
      const area = document.getElementById('orderItems');
      const badge = document.getElementById('cartBadge');
      const total = cart.reduce((s,i)=>s+i.qty,0);
      if (badge) { badge.textContent = total; badge.style.display = total ? '' : 'none'; }

      if (!cart.length) {
        area.innerHTML = `<div class="empty-order"><div class="empty-order-icon">🛒</div><div>No items yet</div><div style="font-size:11px">Tap a menu item to add</div></div>`;
      } else {
        area.innerHTML = cart.map(item => `
          <div class="order-item">
            <div class="item-emoji">${item.emoji}</div>
            <div class="item-info">
              <div class="item-name">${item.name}</div>
              <div class="item-variant">${item.cat}</div>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
              <span class="qty-num">${item.qty}</span>
              <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
            </div>
            <div class="item-price">${fmt(item.price * item.qty)}</div>
          </div>`).join('');
      }
      document.getElementById('subtotalVal').textContent = fmt(subtotal());
      document.getElementById('discountVal').textContent = '− ' + fmt(discountAmt());
      document.getElementById('taxVal').textContent = fmt(taxAmt());
      document.getElementById('grandVal').textContent = fmt(grandTotal());
    }

    function updateDiscount() {
      discountPct = Math.min(parseFloat(document.getElementById('discInput').value)||0, 100);
      renderCart();
    }

    function setOrderType(type) {
      orderType = type;
      document.querySelectorAll('.type-tab').forEach(t => t.classList.toggle('active', t.dataset.type===type));
    }

    function openKOT() {
      if (!cart.length) { showToast('❌ No items in order', true); return; }
      document.getElementById('kotInfo').textContent = `Table ${activeTable} · ${orderType} · Cashier: Zohaib`;
      document.getElementById('kotBody').innerHTML = cart.map(i =>
        `<div class="kot-item"><span>${i.qty}× ${i.name}</span><span>${fmt(i.price*i.qty)}</span></div>`
      ).join('') + `<div class="kot-item" style="font-weight:700;color:var(--accent2)"><span>TOTAL</span><span>${fmt(grandTotal())}</span></div>`;
      document.getElementById('kotModal').classList.add('open');
    }

    function confirmKOT() {
      document.getElementById('kotModal').classList.remove('open');
      showToast('🎫 KOT sent to kitchen!');
    }

    function processPayment(method) {
      if (!cart.length) { showToast('❌ No items in order', true); return; }
      showToast(`✅ Payment ${fmt(grandTotal())} via ${method} — Done!`);
      setTimeout(() => { cart=[]; document.getElementById('discInput').value=''; discountPct=0; renderCart(); }, 1000);
    }

    window.onload = () => { initPage('pos'); renderCats(); renderMenu(); renderCart(); };
  </script>
</body>
</html>
