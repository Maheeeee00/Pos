<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Bank POS — New Order</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 3-column POS layout */
    .app-root { grid-template-columns: 220px 1fr 360px; }

    /* ── Menu Area ── */
    .menu-area {
      grid-area: main;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .menu-topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .search-wrap {
      flex: 1;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 9px 14px 9px 38px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      background: var(--surface2);
      color: var(--fg);
      font-family: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,67,26,.12); background: var(--surface); }
    .search-wrap::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; pointer-events: none; }

    .cat-strip {
      display: flex;
      gap: 6px;
      padding: 10px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .cat-strip::-webkit-scrollbar { display: none; }
    .cat-pill {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--fg2);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .cat-pill:hover  { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
    .cat-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 3px 8px rgba(232,67,26,.3); }

    /* Scrollable product area */
    .menu-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    /* Section header */
    .section-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
    }
    .section-head + .section-head, .section-grid + .section-head {
      margin-top: 24px;
    }
    .section-icon { font-size: 20px; }
    .section-name { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700; color: var(--fg); }
    .section-count { font-size: 11px; color: var(--fg3); background: var(--surface3); padding: 2px 8px; border-radius: 10px; font-weight: 600; }

    /* Product grid within a section */
    .section-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 10px;
      margin-bottom: 4px;
    }

    .menu-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all .18s;
      position: relative;
    }
    .menu-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(232,67,26,.15); }
    .menu-card.in-cart { border-color: var(--accent); background: var(--accent-bg); }
    .menu-card.in-cart .card-img { background: rgba(232,67,26,.08); }

    .card-img { width: 100%; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; font-size: 38px; background: var(--surface2); transition: background .18s; }
    .card-body { padding: 10px 10px 8px; }
    .card-name { font-weight: 700; font-size: 12px; margin-bottom: 2px; line-height: 1.3; color: var(--fg); }
    .card-desc { font-size: 10px; color: var(--fg3); margin-bottom: 8px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; }
    .card-price { font-weight: 800; font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
    .add-btn {
      width: 26px; height: 26px;
      background: var(--accent);
      border: none; border-radius: 7px;
      color: #fff; font-size: 18px; line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
      font-weight: 700;
    }
    .add-btn:hover { background: var(--accent2); transform: scale(1.1); }
    .bestseller-tag {
      position: absolute; top: 7px; left: 7px;
      background: var(--gold); color: #fff;
      font-size: 8px; font-weight: 800;
      padding: 2px 6px; border-radius: 4px;
      letter-spacing: .5px; text-transform: uppercase;
    }
    .in-cart-badge {
      position: absolute; top: 7px; right: 7px;
      background: var(--accent); color: #fff;
      font-size: 10px; font-weight: 800;
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    /* Search results = flat grid, no sections */
    .search-results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 10px;
    }

    /* No results */
    .no-results { text-align: center; padding: 60px 20px; color: var(--fg3); }
    .no-results-icon { font-size: 48px; margin-bottom: 12px; opacity: .4; }
    .no-results-text { font-size: 14px; font-weight: 600; }
    .no-results-sub  { font-size: 12px; margin-top: 4px; }

    /* ── Order Panel ── */
    .order-panel {
      grid-area: panel;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .order-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .order-title { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 15px; color: var(--fg); }
    .order-type-tabs { display: flex; padding: 10px 14px; gap: 6px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .type-tab {
      flex: 1; padding: 7px 4px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: var(--surface2);
      color: var(--fg2);
      font-size: 11px; font-weight: 600;
      cursor: pointer; text-align: center;
      transition: all .15s; font-family: inherit;
    }
    .type-tab:hover { border-color: var(--accent); color: var(--accent); }
    .type-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .order-items { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .order-item { background: var(--surface2); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); }
    .item-emoji { font-size: 20px; flex-shrink: 0; }
    .item-info { flex: 1; min-width: 0; }
    .item-name { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-cat  { font-size: 10px; color: var(--fg3); margin-top: 1px; }
    .qty-controls { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .qty-btn { width: 22px; height: 22px; border: 1.5px solid var(--border); border-radius: 5px; background: var(--surface); color: var(--fg2); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all .12s; font-family: inherit; font-weight: 700; }
    .qty-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
    .qty-num { font-weight: 700; font-size: 13px; min-width: 16px; text-align: center; font-variant-numeric: tabular-nums; }
    .item-price { font-weight: 700; font-size: 12px; color: var(--accent); min-width: 50px; text-align: right; font-variant-numeric: tabular-nums; }

    .empty-cart { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--fg3); gap: 8px; padding: 20px; text-align: center; }
    .empty-cart-icon { font-size: 44px; opacity: .3; }

    .order-footer { border-top: 1px solid var(--border); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; background: var(--surface2); }
    .customer-row { display: flex; gap: 6px; }
    .customer-input { flex: 1; background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px; color: var(--fg); padding: 8px 10px; font-size: 12px; outline: none; transition: border-color .15s; font-family: inherit; }
    .customer-input:focus { border-color: var(--accent); }
    .discount-row { display: flex; gap: 8px; align-items: center; }
    .discount-input { width: 65px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px; color: var(--fg); padding: 7px 10px; font-size: 12px; outline: none; font-family: inherit; }
    .discount-input:focus { border-color: var(--accent); }
    .total-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--fg2); }
    .total-row span:last-child { font-variant-numeric: tabular-nums; }
    .total-row.grand { color: var(--fg); font-size: 16px; font-weight: 800; padding: 8px 0 4px; border-top: 2px solid var(--border); margin-top: 2px; }

    .kot-btn { width: 100%; padding: 10px; border: 1.5px solid var(--border); background: var(--surface); border-radius: 10px; color: var(--fg2); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; font-family: inherit; }
    .kot-btn:hover { border-color: var(--info); color: var(--info); background: var(--info-bg); }

    .pay-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .pay-btn { padding: 11px 8px; border: none; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 5px; font-family: inherit; }
    .pay-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .pay-cash  { background: var(--success); color: #fff; }
    .pay-card  { background: var(--info-bg); color: var(--info); border: 1.5px solid var(--info); }
    .pay-split { background: var(--gold); color: #fff; }
    .pay-hold  { background: var(--surface3); border: 1.5px solid var(--border); color: var(--fg2); }

    .kot-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
  </style>
</head>
<body>
  <div class="app-root" style="grid-template-areas:'sidebar topbar topbar' 'sidebar main panel';">
    <header class="topbar" id="topbar"></header>
    <nav class="sidebar" id="sidebar"></nav>

    <!-- ═══ MENU AREA ═══ -->
    <main class="menu-area">
      <!-- Search bar -->
      <div class="menu-topbar">
        <div class="search-wrap">
          <input type="text" id="searchInput" placeholder="Search menu items… (e.g. pizza, burger, shake)"
            oninput="searchText=this.value.trim(); renderMenuArea();" autocomplete="off">
        </div>
      </div>

      <!-- Category pills -->
      <div class="cat-strip" id="catStrip"></div>

      <!-- Scrollable product sections -->
      <div class="menu-body" id="menuBody"></div>
    </main>

    <!-- ═══ ORDER PANEL ═══ -->
    <aside class="order-panel">
      <div class="order-header">
        <div class="order-title">Current Order</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <span style="font-size:12px;color:var(--fg3);">Table <strong style="color:var(--gold);" id="activeTableLabel">T1</strong></span>
          <button onclick="cart=[];renderCart()" style="background:none;border:none;color:var(--fg3);cursor:pointer;font-size:18px;line-height:1;padding:2px;" title="Clear">🗑</button>
        </div>
      </div>
      <div class="order-type-tabs">
        <button class="type-tab active" data-type="Dine-in"  onclick="setOrderType('Dine-in')">🍽 Dine-in</button>
        <button class="type-tab"        data-type="Takeaway" onclick="setOrderType('Takeaway')">🥡 Takeaway</button>
        <button class="type-tab"        data-type="Delivery" onclick="setOrderType('Delivery')">🛵 Delivery</button>
      </div>
      <div class="order-items" id="orderItems"></div>
      <div class="order-footer">
        <div class="customer-row">
          <input class="customer-input" placeholder="👤 Customer name" style="flex:1.4;">
          <input class="customer-input" placeholder="📱 Phone">
        </div>
        <div class="discount-row">
          <span style="font-size:12px;color:var(--fg2);">Discount %</span>
          <input class="discount-input" id="discInput" type="number" min="0" max="100" placeholder="0" oninput="updateDiscount()">
          <span style="margin-left:auto;font-size:11px;color:var(--fg3);">5% Tax</span>
        </div>
        <div class="total-row"><span>Subtotal</span><span id="subtotalVal">Rs. 0</span></div>
        <div class="total-row" style="color:var(--success);"><span>Discount</span><span id="discountVal">− Rs. 0</span></div>
        <div class="total-row"><span>Tax (5%)</span><span id="taxVal">Rs. 0</span></div>
        <div class="total-row grand"><span>Total</span><span id="grandVal">Rs. 0</span></div>
        <button class="kot-btn" onclick="openKOT()">🎫 Send to Kitchen (KOT)</button>
        <div class="pay-btns">
          <button class="pay-btn pay-cash"  onclick="processPayment('Cash')">💵 Cash</button>
          <button class="pay-btn pay-card"  onclick="processPayment('Card')">💳 Card</button>
          <button class="pay-btn pay-split" onclick="processPayment('Split')">🔀 Split</button>
          <button class="pay-btn pay-hold"  onclick="showToast('🕒 Order held!')">⏸ Hold</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- KOT Modal -->
  <div class="modal-overlay" id="kotModal" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="modal">
      <h3>🎫 Kitchen Order Ticket</h3>
      <div style="font-size:11px;color:var(--fg3);margin-bottom:12px;" id="kotInfo"></div>
      <div id="kotBody"></div>
      <div class="modal-btns">
        <button class="modal-btn modal-cancel"  onclick="document.getElementById('kotModal').classList.remove('open')">Cancel</button>
        <button class="modal-btn modal-confirm" onclick="confirmKOT()">✅ Confirm & Send</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    let cart = [], orderType = 'Dine-in', activeTable = 'T1';
    let activeCategory = 'All', searchText = '', discountPct = 0;

    /* ─── Category icons map ─── */
    const CAT_ICONS = {
      'Pizza':'🍕', 'Burgers':'🍔', 'Pasta':'🍝',
      'Sides':'🍟', 'Drinks':'🥤', 'Desserts':'🍰', 'All':'🍽'
    };

    /* ─── Table select ─── */
    function selectTable(id) {
      activeTable = id;
      document.getElementById('activeTableLabel').textContent = id;
      document.querySelectorAll('.table-chip').forEach(c => c.classList.remove('active'));
      const chip = document.getElementById('chip-' + id);
      if (chip) chip.classList.add('active');
    }

    /* ─── Cart helpers ─── */
    function addToCart(id) {
      const item = MENU.find(m => m.id === id);
      const ex = cart.find(c => c.id === id);
      if (ex) ex.qty++;
      else cart.push({ ...item, qty: 1 });
      renderCart();
      renderMenuArea();       // refresh in-cart badges
      showToast(item.emoji + ' ' + item.name + ' added');
    }

    function changeQty(id, delta) {
      const idx = cart.findIndex(c => c.id === id);
      if (idx < 0) return;
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      renderCart();
      renderMenuArea();
    }

    function subtotal()    { return cart.reduce((s,i)=>s+i.price*i.qty, 0); }
    function discountAmt() { return Math.round(subtotal()*discountPct/100); }
    function taxAmt()      { return Math.round((subtotal()-discountAmt())*0.05); }
    function grandTotal()  { return subtotal()-discountAmt()+taxAmt(); }
    function inCartQty(id) { const x=cart.find(c=>c.id===id); return x?x.qty:0; }

    /* ─── Render category pills ─── */
    function renderCatStrip() {
      document.getElementById('catStrip').innerHTML = CATEGORIES.map(c =>
        `<button class="cat-pill ${c===activeCategory?'active':''}" onclick="setCategory('${c}')">
          ${CAT_ICONS[c]||'🍽'} ${c}
        </button>`
      ).join('');
    }

    function setCategory(cat) {
      activeCategory = cat;
      searchText = '';
      document.getElementById('searchInput').value = '';
      renderCatStrip();
      renderMenuArea();
    }

    /* ─── One card HTML ─── */
    function cardHTML(item) {
      const qty = inCartQty(item.id);
      return `
        <div class="menu-card${qty?'  in-cart':''}" onclick="addToCart(${item.id})">
          ${item.best ? '<div class="bestseller-tag">⭐ Best</div>' : ''}
          ${qty ? `<div class="in-cart-badge">${qty}</div>` : ''}
          <div class="card-img">${item.emoji}</div>
          <div class="card-body">
            <div class="card-name">${item.name}</div>
            <div class="card-desc">${item.desc}</div>
            <div class="card-footer">
              <span class="card-price">${fmt(item.price)}</span>
              <button class="add-btn" onclick="event.stopPropagation();addToCart(${item.id})">+</button>
            </div>
          </div>
        </div>`;
    }

    /* ─── Render menu body ─── */
    function renderMenuArea() {
      const body = document.getElementById('menuBody');

      /* SEARCH MODE — flat grid, no sections */
      if (searchText) {
        const results = MENU.filter(i =>
          i.name.toLowerCase().includes(searchText.toLowerCase()) ||
          i.cat.toLowerCase().includes(searchText.toLowerCase()) ||
          i.desc.toLowerCase().includes(searchText.toLowerCase())
        );
        if (!results.length) {
          body.innerHTML = `<div class="no-results">
            <div class="no-results-icon">🔍</div>
            <div class="no-results-text">No items found for "${searchText}"</div>
            <div class="no-results-sub">Try a different keyword</div>
          </div>`;
          return;
        }
        body.innerHTML = `
          <div style="margin-bottom:12px;font-size:12px;color:var(--fg3);font-weight:600;">
            ${results.length} result${results.length!==1?'s':''} for "<span style="color:var(--accent);">${searchText}</span>"
          </div>
          <div class="search-results-grid">${results.map(cardHTML).join('')}</div>`;
        return;
      }

      /* CATEGORY FILTER MODE — one section */
      if (activeCategory !== 'All') {
        const items = MENU.filter(i => i.cat === activeCategory);
        body.innerHTML = `
          <div class="section-head">
            <span class="section-icon">${CAT_ICONS[activeCategory]||'🍽'}</span>
            <span class="section-name">${activeCategory}</span>
            <span class="section-count">${items.length} items</span>
          </div>
          <div class="section-grid">${items.map(cardHTML).join('')}</div>`;
        return;
      }

      /* ALL CATEGORIES — grouped sections */
      const cats = CATEGORIES.filter(c => c !== 'All');
      body.innerHTML = cats.map(cat => {
        const items = MENU.filter(i => i.cat === cat);
        if (!items.length) return '';
        return `
          <div class="section-head">
            <span class="section-icon">${CAT_ICONS[cat]||'🍽'}</span>
            <span class="section-name">${cat}</span>
            <span class="section-count">${items.length} items</span>
          </div>
          <div class="section-grid">${items.map(cardHTML).join('')}</div>`;
      }).join('');
    }

    /* ─── Render cart ─── */
    function renderCart() {
      const area = document.getElementById('orderItems');
      if (!cart.length) {
        area.innerHTML = `<div class="empty-cart">
          <div class="empty-cart-icon">🛒</div>
          <div style="font-weight:600;font-size:13px;">No items yet</div>
          <div style="font-size:11px;margin-top:4px;">Tap any menu item to add it here</div>
        </div>`;
      } else {
        area.innerHTML = cart.map(item => `
          <div class="order-item">
            <div class="item-emoji">${item.emoji}</div>
            <div class="item-info">
              <div class="item-name">${item.name}</div>
              <div class="item-cat">${item.cat} · ${fmt(item.price)}</div>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
              <span class="qty-num">${item.qty}</span>
              <button class="qty-btn" onclick="changeQty(${item.id},+1)">+</button>
            </div>
            <div class="item-price">${fmt(item.price*item.qty)}</div>
          </div>`).join('');
      }
      document.getElementById('subtotalVal').textContent = fmt(subtotal());
      document.getElementById('discountVal').textContent = '− '+fmt(discountAmt());
      document.getElementById('taxVal').textContent      = fmt(taxAmt());
      document.getElementById('grandVal').textContent    = fmt(grandTotal());
    }

    function updateDiscount() {
      discountPct = Math.min(parseFloat(document.getElementById('discInput').value)||0, 100);
      renderCart();
    }

    function setOrderType(type) {
      orderType = type;
      document.querySelectorAll('.type-tab').forEach(t=>t.classList.toggle('active',t.dataset.type===type));
    }

    function openKOT() {
      if (!cart.length) { showToast('❌ No items in order', true); return; }
      document.getElementById('kotInfo').textContent = `Table ${activeTable} · ${orderType} · Cashier: Zohaib`;
      document.getElementById('kotBody').innerHTML = cart.map(i=>
        `<div class="kot-item"><span>${i.qty}× ${i.name}</span><span>${fmt(i.price*i.qty)}</span></div>`
      ).join('') + `<div class="kot-item" style="font-weight:800;color:var(--accent);border-top:2px solid var(--border);border-bottom:none;padding-top:12px;margin-top:4px;">
        <span>TOTAL</span><span>${fmt(grandTotal())}</span></div>`;
      document.getElementById('kotModal').classList.add('open');
    }

    function confirmKOT() {
      document.getElementById('kotModal').classList.remove('open');
      showToast('🎫 KOT sent to kitchen!');
    }

    function processPayment(method) {
      if (!cart.length) { showToast('❌ No items in order', true); return; }
      showToast(`✅ ${fmt(grandTotal())} received via ${method}!`);
      setTimeout(()=>{ cart=[]; document.getElementById('discInput').value=''; discountPct=0; renderCart(); renderMenuArea(); }, 1200);
    }

    window.onload = () => {
      initPage('pos');
      renderCatStrip();
      renderMenuArea();
      renderCart();
    };
  </script>
</body>
</html>
